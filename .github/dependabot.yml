version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet, so a PR that bumps ESLint to 10 cannot install
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # typescript-eslint 8 supports TypeScript below 6.1 only, so TypeScript 7 cannot install yet
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint-plugin-react-refresh 0.5 needs ESLint 9, and this project is on ESLint 8
      - dependency-name: eslint-plugin-react-refresh
        update-types: ['version-update:semver-minor']
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
